name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALIGNMENT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - name: Require Compose configuration validation
        run: docker compose version
      - name: Install Chromium for browser integration tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Build plugin submission candidates
        run: pnpm pack:plugins && pnpm pack:local-plugin
      - name: Upload plugin packages and publication readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theoryfoundry-plugin-candidates
          path: |
            dist/local-plugin/*.zip
            dist/mcp-plugins/*.zip
            dist/mcp-plugins/release-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: |
            test-results/browser/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and smoke-test the versioned worker tarball outside the repository
        run: pnpm pack:worker && node tooling/local-worker/packedAcceptance.script.mjs --smoke
      - name: Confirm verification did not rewrite tracked files
        run: git diff --exit-code

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the production runtime image and its test stage
        run: docker build --target runtime --tag theoryfoundry-ci .
