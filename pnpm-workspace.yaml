packages:
  - apps/*
  - packages/*
  - packages/runtime/model-project

allowBuilds:
  esbuild: true
  sharp: true

patchedDependencies:
  "@langchain/core@1.2.4": patches/@langchain__core@1.2.4.patch

# Stable Drizzle Kit still depends on the legacy esbuild loader.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # Stable TypeScript ESLint still requests minimatch 10; remove when it adopts 11.
  "@typescript-eslint/typescript-estree>minimatch": 11.0.8
