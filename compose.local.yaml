name: rjls-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rjls
    ports:
      - "127.0.0.1:${RJLS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rjls"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
    name: rjls-postgres-data
